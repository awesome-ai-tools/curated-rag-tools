<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#bc8cff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#bc8cff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" rx="12" fill="url(#bgGrad)" />

  <!-- Border -->
  <rect width="798" height="198" x="1" y="1" rx="11" fill="none" stroke="url(#accentGrad)" stroke-width="1" />

  <!-- Decorative nodes -->
  <circle cx="120" cy="60" r="4" fill="#58a6ff" opacity="0.6" />
  <circle cx="680" cy="140" r="4" fill="#bc8cff" opacity="0.6" />
  <circle cx="90" cy="150" r="3" fill="#bc8cff" opacity="0.4" />
  <circle cx="710" cy="55" r="3" fill="#58a6ff" opacity="0.4" />
  <circle cx="200" cy="170" r="2" fill="#58a6ff" opacity="0.3" />
  <circle cx="600" cy="30" r="2" fill="#bc8cff" opacity="0.3" />

  <!-- Connecting lines (representing retrieval paths) -->
  <line x1="120" y1="60" x2="200" y2="170" stroke="#58a6ff" stroke-width="0.5" opacity="0.2" />
  <line x1="680" y1="140" x2="600" y2="30" stroke="#bc8cff" stroke-width="0.5" opacity="0.2" />
  <line x1="90" y1="150" x2="120" y2="60" stroke="#bc8cff" stroke-width="0.5" opacity="0.15" />
  <line x1="710" y1="55" x2="680" y2="140" stroke="#58a6ff" stroke-width="0.5" opacity="0.15" />

  <!-- Database icon -->
  <g transform="translate(155, 72)" opacity="0.8">
    <ellipse cx="20" cy="0" rx="20" ry="7" fill="none" stroke="#58a6ff" stroke-width="1.5" />
    <line x1="0" y1="0" x2="0" y2="30" stroke="#58a6ff" stroke-width="1.5" />
    <line x1="40" y1="0" x2="40" y2="30" stroke="#58a6ff" stroke-width="1.5" />
    <ellipse cx="20" cy="30" rx="20" ry="7" fill="none" stroke="#58a6ff" stroke-width="1.5" />
    <ellipse cx="20" cy="15" rx="20" ry="7" fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.5" />
  </g>

  <!-- Arrow (retrieval flow) -->
  <g transform="translate(215, 82)" opacity="0.7">
    <line x1="0" y1="10" x2="35" y2="10" stroke="#8b949e" stroke-width="1.5" />
    <polygon points="35,5 45,10 35,15" fill="#8b949e" />
  </g>

  <!-- Brain/AI icon -->
  <g transform="translate(270, 72)" opacity="0.8">
    <circle cx="18" cy="15" r="15" fill="none" stroke="#bc8cff" stroke-width="1.5" />
    <path d="M10,12 Q14,4 18,12 Q22,4 26,12" fill="none" stroke="#bc8cff" stroke-width="1.2" />
    <path d="M10,18 Q14,26 18,18 Q22,26 26,18" fill="none" stroke="#bc8cff" stroke-width="1.2" />
    <line x1="18" y1="5" x2="18" y2="25" stroke="#bc8cff" stroke-width="0.8" opacity="0.5" />
    <line x1="8" y1="15" x2="28" y2="15" stroke="#bc8cff" stroke-width="0.8" opacity="0.5" />
  </g>

  <!-- Main title -->
  <text x="400" y="95" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="url(#textGrad)">Curated RAG Tools</text>

  <!-- Subtitle -->
  <text x="400" y="130" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="16" fill="#8b949e" font-weight="400">Retrieval-Augmented Generation tools, frameworks, and resources</text>

  <!-- Decorative bottom line -->
  <rect x="300" y="150" width="200" height="1" rx="0.5" fill="url(#accentGrad)" />
</svg>